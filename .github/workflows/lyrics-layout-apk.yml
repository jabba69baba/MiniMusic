name: Build MiniMusic ARM64 release APK

on:
  push:
    branches:
      - visual-fixes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-release:
    name: Build ARM64-v8a release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ARM64-v8a release APK
        # lintVitalAnalyzeRelease currently crashes inside the Android lint
        # detector before packaging; compilation and release packaging remain
        # enabled, and this workaround is limited to CI artifact generation.
        run: ./gradlew assembleRelease -x lintVitalAnalyzeRelease --no-daemon --stacktrace

      - name: Upload ARM64-v8a release APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniMusic-arm64-v8a-release
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
