name: Build MiniMusic APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Installs Gradle 8.10 directly on the runner and runs it as `gradle`.
      # This sidesteps needing gradlew / gradle-wrapper.jar in the repo at all —
      # useful since those didn't make it into the uploaded project.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniMusic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
