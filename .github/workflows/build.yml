name: Build MiniMusic APK

on:
  push:
    branches: [ main, master, m3e-expressive-rollout ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniMusic-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Release (R8 + shrunk, debug-signed so it installs without a private
      # key): this is the build to judge smoothness AND size by. Debug builds
      # carry ~80MB of unshaken dex and run unoptimized — testing feel on
      # debug will always read worse than what users get.
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniMusic-release-apk
          path: app/build/outputs/apk/release/*.apk
