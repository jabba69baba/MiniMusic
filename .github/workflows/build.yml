name: Build MiniMusic APK

on:
  push:
    branches: [ main, master, m3e-expressive-rollout, arena/01a096d7-minimusic, arena/01a0a8eb-minimusic, arena/01a0aead-minimusic, arena/7909bc0b-minimusic ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test-output.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: test-output.log

      - name: Surface unit-test failure (annotation + artifact name)
        id: failreport
        if: failure()
        run: |
          # Kotlin compile errors look like:
          #   e: /home/runner/work/MiniMusic/MiniMusic/app/src/test/.../Foo.kt: (42, 23): Unresolved reference: bar
          # Keep "File.kt: (line, col): message" — that is the actionable part.
          # Test failures look like:
          #   FooTest > someTest FAILED
          #       java.lang.AssertionError: <message>
          ERRS=$(grep -E "^e: " test-output.log | sed -E 's|^e: [^ ]*/||' | head -5 | tr '\n' ' | ' | cut -c1-400)
          if [ -z "$ERRS" ]; then
            ERRS=$({ grep -E " FAILED$" test-output.log | grep -v "^> Task" | head -4; \
                     grep -m2 -E "AssertionError|Exception:" test-output.log; } \
                | tr '\n' ' | ' | cut -c1-400)
          fi
          if [ -z "$ERRS" ]; then
            ERRS=$(grep -m1 -E "What went wrong|> Task .* FAILED|Exception" test-output.log | tr '\n' ' ' | cut -c1-300)
          fi
          [ -z "$ERRS" ] && ERRS="see unit-test-log artifact"
          # Check-run annotation: readable via the Checks API without any write
          # permission on the repo.
          echo "::error title=Unit-test failure::$(echo "$ERRS" | cut -c1-300)"
          # Artifact name: also API-listable, second channel.
          echo "name=fail_$(echo "$ERRS" | tr -c 'A-Za-z0-9' '_' | cut -c1-200)" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/failart
          {
            echo "extracted error line(s):"
            echo "$ERRS"
            echo
            echo "tail of test-output.log:"
            tail -n 120 test-output.log
          } > /tmp/failart/failure.txt
      - name: Upload failure artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.failreport.outputs.name }}
          path: /tmp/failart

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-debug.log

      - name: Report Gradle diagnostics
        if: failure()
        run: |
          echo "Gradle diagnostics (last 120 lines):"
          tail -120 build-debug.log
          grep -E "(^e: |error:|Error:|FAILURE:)" build-debug.log | tail -80 || true
          while IFS= read -r line; do echo "::error::$line"; done < <(grep -E "(^e: |error:|Error:|FAILURE:)" build-debug.log | tail -80)

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: build-debug.log

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniMusic-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Release (R8 + shrunk, debug-signed so it installs without a private
      # key): this is the build to judge smoothness AND size by. Debug builds
      # carry ~80MB of unshaken dex and run unoptimized — testing feel on
      # debug will always read worse than what users get.
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniMusic-release-apk
          path: app/build/outputs/apk/release/*.apk
